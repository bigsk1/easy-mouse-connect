name: Verify and package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep Windows-staged source identical to the Linux publisher checkout.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Package privacy and release safeguards
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Install Rust checks
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Portable and platform crate tests
        run: cargo +stable test --locked -p emc-protocol -p emc-core -p emc-platform
      - name: Native input API contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-native-input.ps1
      - name: Clippy
        run: cargo +stable clippy --locked -p emc-protocol -p emc-core -p emc-platform --all-targets -- -D warnings

  windows-desktop:
    name: Windows desktop and unsigned installer
    needs: core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Rust checks
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $hasErrors = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $hasErrors = $true
              $parseErrors | ForEach-Object { Write-Error $_.Message -ErrorAction Continue }
            }
          }
          if ($hasErrors) { throw 'PowerShell parse errors.' }
      - name: Install Tauri CLI from lockfile
        run: npm ci
      - name: Check vanilla JavaScript
        run: npm run check:ui
      - name: Install UI test browser
        run: npx playwright install chromium
      - name: Browser preview and synthetic bridge checks
        id: ui_checks
        env:
          UI_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/emc-ui-test-artifacts
        run: npm run test:ui
      - name: Save UI failure screenshot
        if: ${{ failure() && steps.ui_checks.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: easy-mouse-connect-ui-failure-${{ github.sha }}
          path: ${{ runner.temp }}/emc-ui-test-artifacts/failure.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Check desktop
        run: cargo +stable clippy --locked --manifest-path apps/desktop/Cargo.toml --all-targets -- -D warnings
      - name: Build unsigned NSIS package
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SkipChecks
      - name: Package the same executable with the preview installer
        shell: pwsh
        run: |
          $nsisCache = Join-Path $env:LOCALAPPDATA 'tauri\NSIS'
          # Tauri invokes this root launcher. Its toolchain also contains a
          # Bin/makensis.exe payload, so recursive uniqueness is not valid.
          $compiler = Join-Path $nsisCache 'makensis.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            $availableCompiler = Get-Command makensis.exe -CommandType Application -ErrorAction SilentlyContinue
            if ($null -eq $availableCompiler) {
              throw 'NSIS compiler not found in the Tauri cache or PATH after the Tauri build.'
            }
            $compiler = $availableCompiler.Source
          }
          $nsisDirectory = Split-Path -Parent $compiler
          if (-not (Test-Path -LiteralPath (Join-Path $nsisDirectory 'Include\MUI2.nsh') -PathType Leaf)) {
            throw 'The NSIS compiler is missing its accompanying include files.'
          }
          $env:NSISDIR = $nsisDirectory
          python scripts/package-preview.py --binary target/release/easy-mouse-connect.exe --output artifacts/windows-preview --makensis $compiler
          if ($LASTEXITCODE -ne 0) { throw 'Preview packaging failed.' }
      - name: Stage preview assets and sanitized source
        run: python scripts/stage-preview.py --package artifacts/windows-preview --destination artifacts/staged-preview
      - name: Save Windows preview package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: easy-mouse-connect-windows-x64-unsigned-${{ github.sha }}
          path: |
            artifacts/staged-preview/EasyMouseConnect-*-preview-setup.exe
            artifacts/staged-preview/easy-mouse-connect.exe
            artifacts/staged-preview/START-HERE.txt
            artifacts/staged-preview/Easy-Mouse-Connect-source-*-preview.zip
            artifacts/staged-preview/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
